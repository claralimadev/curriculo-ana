<header class="navbar">
  <a href="#inicio" class="navbar__logo" (click)="navegar($event, '#inicio')">AC</a>

  <button
    type="button"
    class="navbar__toggle"
    [attr.aria-expanded]="aberto()"
    [attr.aria-label]="aberto() ? 'Fechar menu' : 'Abrir menu'"
    (click)="toggle()">
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
  </button>

  <nav class="navbar__links" [class.navbar__links--aberto]="aberto()" aria-label="Navegação principal">
    <a href="#inicio" (click)="navegar($event, '#inicio')">Início</a>
    <a href="#sobre" (click)="navegar($event, '#sobre')">Sobre</a>
    <a href="#projetos" (click)="navegar($event, '#projetos')">Projetos</a>
    <a href="#habilidades" (click)="navegar($event, '#habilidades')">Habilidades</a>
    <a href="#trajetoria" (click)="navegar($event, '#trajetoria')">Trajetória</a>
    <a href="#contato" (click)="navegar($event, '#contato')">Contato</a>
  </nav>
</header>
