<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Currículo Digital — Ana Clara Lima Ribeiro | Dev</title>
  <base href="/">
  <meta name="description" content="Currículo digital interativo de Ana Clara Lima Ribeiro, desenvolvedora participante do Hackathon Proenergia Summit 2026.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget({ rootPath: 'https://vlibras.gov.br/app', position: 'r' });
    (function ajustarVlibras() {
      var wrapper = document.getElementById('vlibras-access-wrapper');
      if (wrapper && wrapper.shadowRoot) {
        var style = document.createElement('style');
        style.textContent = [
          '#vlibras-popup { display: none !important; }',
          '#vlibras-access { top: 64px !important; right: 12px !important; left: auto !important; width: 40px !important; height: 40px !important; transform: scale(0.8); transform-origin: top right; }',
          '#vlibras-button { width: 40px !important; height: 40px !important; }',
          '@media (max-width: 767px) { #vlibras-access { top: 12px !important; right: 8px !important; transform: scale(0.72); } }'
        ].join('\n');
        wrapper.shadowRoot.appendChild(style);
      } else {
        setTimeout(ajustarVlibras, 200);
      }
    })();
  </script>
</body>
</html>
